name: Capacity verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-compose:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # Keep AOF writes and restart recovery in scope while deferring background
      # compaction outside this short, disposable latency measurement window.
      VALKEY_AUTO_AOF_REWRITE_PERCENTAGE: "0"
      # The disposable stack has no old-image overlap. Production follows the staged enablement
      # and rollback procedure in docs/runbooks/upgrade.md.
      PRESENTATION_CONCURRENT_RESPONSE_WRITES: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start stress-capable media profile
        run: docker compose -f compose.yaml -f compose.media.yaml -f compose.test.yaml up -d --build --wait
      - name: 250-client single-session restart gate
        run: pnpm load:compose
        env:
          ASSERT_PERFORMANCE: "true"
          CLIENTS: "250"
          JOIN_BATCH_SIZE: "25"
          LOAD_OUTPUT: capacity-single-session.json
          RESTART_SERVER: "true"
      - name: 50-client Presentation correctness and latency gate
        run: pnpm load:presentation:compose
        env:
          ASSERT_PERFORMANCE: "true"
          CLIENTS: "50"
          JOIN_BATCH_SIZE: "20"
          LOAD_ENABLE_LOCAL_PRESENTATION_ROLLOUT: "true"
          LOAD_OUTPUT: capacity-presentation-50.json
          RESTART_SERVER: "false"
      - name: 250-client Presentation coordination-loss, restart, and reconciliation gate
        run: pnpm load:presentation:compose
        env:
          ASSERT_PERFORMANCE: "true"
          CLIENTS: "250"
          JOIN_BATCH_SIZE: "25"
          LOAD_ENABLE_LOCAL_PRESENTATION_ROLLOUT: "true"
          LOAD_OUTPUT: capacity-presentation-250.json
          RESTART_SERVER: "true"
          RESET_VALKEY: "true"
      - name: 1,000-client multi-session gate
        run: |
          docker compose --profile load -f compose.yaml -f compose.media.yaml -f compose.test.yaml build load
          docker compose --profile load -f compose.yaml -f compose.media.yaml -f compose.test.yaml run --rm -T --user "$(id -u):$(id -g)" --volume "$PWD:/evidence" --env LOAD_OUTPUT=/evidence/capacity-aggregate.json load
        env:
          # The hosted runner co-locates ten generator processes, PostgreSQL, and
          # the server on variable shared hardware. Keep the controlled/target
          # environment defaults at 250/600/500 ms. This co-located CI sample
          # enforces the beta's one-second client-latency budget; strict release
          # capacity evidence still comes from controlled or target hardware.
          ANSWER_P95_LIMIT_MS: "1000"
          ANSWER_P99_LIMIT_MS: "1000"
          QUESTION_BROADCAST_P95_LIMIT_MS: "1000"
      - name: Capture Compose logs
        if: failure()
        run: docker compose --profile load -f compose.yaml -f compose.media.yaml -f compose.test.yaml logs --no-color > capacity-failure.log
      - name: Capture server metrics
        if: always()
        continue-on-error: true
        run: docker compose --profile load -f compose.yaml -f compose.media.yaml -f compose.test.yaml exec -T server wget -qO- http://127.0.0.1:4000/metrics > capacity-metrics.prom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: capacity-evidence-${{ github.run_id }}
          path: |
            capacity-failure.log
            capacity-aggregate.json
            capacity-metrics.prom
            capacity-presentation-50.json
            capacity-presentation-250.json
            capacity-single-session.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Stop disposable stack
        if: always()
        run: docker compose --profile load -f compose.yaml -f compose.media.yaml -f compose.test.yaml down --volumes
