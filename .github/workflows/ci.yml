name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:docker-context
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate fail-fast hosted production configuration
        run: pnpm --filter @openround/server config:check
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://runtime:example@database.internal/openround
          REDIS_URL: rediss://cache.internal:6380
          WEB_ORIGIN: https://quiz.example.ca
          PUBLIC_API_URL: https://api.example.ca
          COOKIE_SECURE: "true"
          FEATURE_SIGNUPS: "false"
          METRICS_ENABLED: "false"
      - run: pnpm readiness:check
      - run: pnpm smoke:tracing
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm \
            --volume "$PWD/infra/observability:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          pnpm test:alerts
          pnpm test:alert-routing
          pnpm test:collector-config
      - name: Validate provisioned Grafana dashboard JSON
        run: >-
          node -e "JSON.parse(require('node:fs').readFileSync('infra/observability/grafana/dashboards/pollingpops-overview.json', 'utf8'))"

  postgres-migration:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openround
          POSTGRES_USER: openround
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openround -d openround"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://openround:test-only@localhost:5432/openround
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openround/db migrate
      - run: pnpm --filter @openround/db migrate
      - run: pnpm --filter @openround/db test:postgres
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://openround:test-only@localhost:5432/openround
          TEST_DATABASE_URL: postgresql://openround_test_app:test-only-runtime@localhost:5432/openround
      - run: pnpm test:multi-writer
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://openround:test-only@localhost:5432/openround
          TEST_DATABASE_URL: postgresql://openround_test_app:test-only-runtime@localhost:5432/openround
          TEST_REDIS_URL: redis://localhost:6379

  browser-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_PRODUCTION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run feature-off browser suite
        run: pnpm test:e2e
      - name: Run UX beta browser suite
        run: pnpm test:e2e:beta
        env:
          BETA_E2E_AUTHORING: "true"
          BETA_E2E_ROUND_PROTOCOL: "true"
      - name: Run business administration browser journeys
        run: pnpm test:e2e:business
      - name: Run operator administration browser journeys
        run: pnpm test:e2e:control
      - name: Run local admin browser journeys
        run: pnpm test:e2e:local-admin
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            playwright-report-beta/
            test-results/
            test-results-beta/
            test-results-business/
            playwright-report-business/
          if-no-files-found: ignore
