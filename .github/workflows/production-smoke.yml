name: Production-path smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify MinIO volume ownership across upgrade and rollback
        run: pnpm smoke:minio-volume-upgrade
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start production media profile
        run: docker compose -f compose.yaml -f compose.media.yaml up -d --build --wait
      - name: Verify one-shot image migration
        run: >-
          docker compose -f compose.yaml -f compose.media.yaml
          run --rm --no-deps server node dist/migrate.js
      - name: Wait for fresh active ClamAV signatures
        timeout-minutes: 2
        shell: bash
        run: |
          compose=(docker compose -f compose.yaml -f compose.media.yaml)
          deadline=$((SECONDS + 90))
          next_reload=0
          scanner_metrics=
          while (( SECONDS < deadline )); do
            if scanner_metrics=$(timeout --kill-after=2s 5s "${compose[@]}" exec -T server wget -qO- http://127.0.0.1:4000/metrics); then
              if grep -Fxq 'openround_malware_scanner_fresh 1' <<< "$scanner_metrics"; then
                exit 0
              fi
              if (( SECONDS >= next_reload )) &&
                grep -Fxq 'openround_malware_scanner_available 1' <<< "$scanner_metrics" &&
                grep -Fxq 'openround_malware_scanner_fresh 0' <<< "$scanner_metrics"; then
                # FreshClam can update the database before clamd can receive its notification.
                next_reload=$((SECONDS + 20))
                timeout --kill-after=2s 10s "${compose[@]}" exec -T clamav clamdscan --reload ||
                  echo "::warning::ClamAV reload request failed. Waiting for fresh signatures."
              fi
            fi
            sleep 5
          done
          grep -E '^openround_malware_(scanner_(available|fresh)|signature_database_(version|timestamp_seconds)) [0-9]+(\.[0-9]+)?$' <<< "$scanner_metrics" || true
          echo "::error::ClamAV did not load fresh signatures. Check scanner connectivity, FreshClam updates, and clamd reloads in the Compose failure artifact."
          exit 1
      - name: API and dependency smoke
        run: pnpm smoke:compose
      - name: Browser media smoke
        run: pnpm test:e2e:compose
      - name: Provision dashboard and evaluate alert rules
        run: |
          docker compose -f compose.yaml -f compose.media.yaml -f compose.observability.yaml --profile observability up -d prometheus grafana
          pnpm smoke:observability
      - name: Two-process mutation and process-loss smoke
        run: |
          docker compose -f compose.yaml -f compose.test.yaml -f compose.multiwriter.yaml up -d --no-build --wait server server-secondary mailpit
          pnpm smoke:multi-process
      - name: Isolated backup and restore drill
        run: pnpm smoke:restore
      - name: 100-client correctness, latency, and restart recovery
        run: pnpm load:compose
        env:
          ASSERT_PERFORMANCE: "true"
          CLIENTS: "100"
          JOIN_BATCH_SIZE: "20"
          LOAD_OUTPUT: artifacts/readiness/production-smoke-load.json
          RESTART_SERVER: "true"
      - name: Capture Compose logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.media.yaml -f compose.test.yaml -f compose.multiwriter.yaml -f compose.observability.yaml --profile observability logs --no-color > compose-failure.log
      - name: Capture server metrics
        if: always()
        continue-on-error: true
        run: docker compose -f compose.yaml -f compose.media.yaml -f compose.test.yaml -f compose.multiwriter.yaml -f compose.observability.yaml --profile observability exec -T server wget -qO- http://127.0.0.1:4000/metrics > production-smoke-metrics.prom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-smoke-evidence-${{ github.run_id }}
          path: |
            artifacts/readiness/production-smoke-load.json
            compose-failure.log
            production-smoke-metrics.prom
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Stop disposable stack
        if: always()
        run: docker compose -f compose.yaml -f compose.media.yaml -f compose.test.yaml -f compose.multiwriter.yaml -f compose.observability.yaml --profile observability down --volumes
