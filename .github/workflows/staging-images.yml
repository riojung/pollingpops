name: Staging images

on:
  repository_dispatch:
    types: [staging-images]

permissions:
  contents: read

concurrency:
  group: single-vm-staging-images
  cancel-in-progress: false

jobs:
  main-candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Verify main-branch candidate
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$GITHUB_EVENT_NAME" = repository_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse --verify HEAD)" = "$(git rev-parse --verify origin/main)"
      - name: Reject dispatcher inputs
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          if (event.action !== "staging-images") {
            throw new Error("Unexpected repository_dispatch event type");
          }

          const payload = event.client_payload ?? {};
          if (payload === null || typeof payload !== "object" || Array.isArray(payload)) {
            throw new Error("client_payload must be a JSON object when provided");
          }
          if (Object.keys(payload).length !== 0) {
            throw new Error("The staging-images dispatch does not accept client_payload inputs");
          }
          NODE
      - name: Validate configured staging deployment target
        run: node scripts/check-deployment-target.mjs staging
      - name: Require protected staging environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-staging-environment.mjs

  build:
    if: github.ref == 'refs/heads/main'
    needs: main-candidate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    environment: single-vm-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Revalidate current main candidate after approval
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$GITHUB_EVENT_NAME" = repository_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse --verify HEAD)" = "$(git rev-parse --verify origin/main)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build, scan, sign, and verify staging images
        run: |
          set -euo pipefail
          api_url="$(jq -r '.publicApiUrl' config/deploy/staging.json)"
          registry="$(jq -r '.imageRepository' config/deploy/staging.json)"
          ./scripts/product-build.sh staging \
            --api-url "$api_url" \
            --registry "$registry" \
            --push \
            --manifest artifacts/deploy/staging/build-manifest.json
      - name: Validate signed manifest
        run: |
          set -euo pipefail
          manifest=artifacts/deploy/staging/build-manifest.json
          test "$(jq -r '.buildId' "$manifest")" = "$GITHUB_SHA"
          test "$(jq -r '.images.server.signed' "$manifest")" = true
          test "$(jq -r '.images.web.signed' "$manifest")" = true
          test "$(jq -r '.nextPublicApiUrl' "$manifest")" = "$(jq -r '.publicApiUrl' config/deploy/staging.json)"
      - name: Upload signed staging manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: single-vm-staging-manifest-${{ github.sha }}
          path: artifacts/deploy/staging/build-manifest.json
          if-no-files-found: error
          retention-days: 30
