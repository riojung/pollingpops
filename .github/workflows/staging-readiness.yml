name: Staging readiness

on:
  repository_dispatch:
    types: [staging-readiness]

permissions:
  contents: read

concurrency:
  group: single-vm-staging-readiness
  cancel-in-progress: false

jobs:
  main-candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_stripe_replay: ${{ steps.payload.outputs.run_stripe_replay }}
      soak_minutes: ${{ steps.payload.outputs.soak_minutes }}
      public_api_url: ${{ steps.target.outputs.public_api_url }}
      public_web_url: ${{ steps.target.outputs.public_web_url }}
      public_media_url: ${{ steps.target.outputs.public_media_url }}
      image_repository: ${{ steps.target.outputs.image_repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Verify main-branch candidate
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$GITHUB_EVENT_NAME" = repository_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse --verify HEAD)" = "$(git rev-parse --verify origin/main)"
      - name: Validate dispatcher payload
        id: payload
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");

          const payload = JSON.parse(process.env.CLIENT_PAYLOAD_JSON ?? "null");
          if (payload === null || typeof payload !== "object" || Array.isArray(payload)) {
            throw new Error("client_payload must be a JSON object");
          }

          const allowedKeys = new Set(["run_stripe_replay", "soak_minutes"]);
          const unknownKeys = Object.keys(payload).filter((key) => !allowedKeys.has(key));
          if (unknownKeys.length > 0) {
            throw new Error(`Unsupported client_payload keys: ${unknownKeys.join(", ")}`);
          }

          const runStripeReplay = payload.run_stripe_replay ?? false;
          const soakMinutes = payload.soak_minutes ?? "0";
          if (typeof runStripeReplay !== "boolean") {
            throw new Error("client_payload.run_stripe_replay must be a boolean");
          }
          if (typeof soakMinutes !== "string" || !["0", "15", "60"].includes(soakMinutes)) {
            throw new Error('client_payload.soak_minutes must be one of "0", "15", or "60"');
          }

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `run_stripe_replay=${runStripeReplay}\nsoak_minutes=${soakMinutes}\n`,
            "utf8",
          );
          NODE
      - name: Validate configured staging deployment target
        run: node scripts/check-deployment-target.mjs staging
      - name: Require protected staging environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-staging-environment.mjs
      - name: Export reviewed staging target
        id: target
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");

          const config = JSON.parse(readFileSync("config/deploy/staging.json", "utf8"));
          for (const [output, key] of [
            ["public_api_url", "publicApiUrl"],
            ["public_web_url", "publicWebUrl"],
            ["public_media_url", "publicMediaUrl"],
            ["image_repository", "imageRepository"],
          ]) {
            const value = output === "image_repository" ? config[key] : new URL(config[key]).origin;
            appendFileSync(process.env.GITHUB_OUTPUT, `${output}=${value}\n`);
          }
          NODE

  remote-readiness:
    if: github.ref == 'refs/heads/main'
    needs: main-candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    environment: single-vm-staging
    env:
      READINESS_API_URL: ${{ needs.main-candidate.outputs.public_api_url }}
      READINESS_WEB_URL: ${{ needs.main-candidate.outputs.public_web_url }}
      READINESS_MEDIA_URL: ${{ needs.main-candidate.outputs.public_media_url }}
      READINESS_EXPECTED_WEB_ORIGIN: ${{ needs.main-candidate.outputs.public_web_url }}
      READINESS_EXPECT_BILLING: ${{ vars.OPENROUND_EXPECTED_BILLING }}
      READINESS_EXPECT_COMMUNITY_MODE: ${{ vars.OPENROUND_EXPECTED_COMMUNITY_MODE }}
      READINESS_EXPECT_SIGNUPS: ${{ vars.OPENROUND_EXPECTED_SIGNUPS }}
      READINESS_EXPECT_SESSION_CREATION: ${{ vars.OPENROUND_EXPECTED_SESSION_CREATION }}
      READINESS_EXPECT_MEDIA_UPLOADS: ${{ vars.OPENROUND_EXPECTED_MEDIA_UPLOADS }}
      READINESS_EXPECT_UX_BETA: ${{ vars.OPENROUND_EXPECTED_UX_BETA }}
      READINESS_EXPECT_RECOVERY_REHEARSAL: ${{ vars.OPENROUND_EXPECTED_RECOVERY_REHEARSAL }}
      READINESS_EXPECT_PRACTICE_ASSIGNMENTS: ${{ vars.OPENROUND_EXPECTED_PRACTICE_ASSIGNMENTS }}
      READINESS_EXPECT_WORKSPACE_SHELL: ${{ vars.OPENROUND_EXPECTED_WORKSPACE_SHELL }}
      READINESS_EXPECT_BUILDER_V2: ${{ vars.OPENROUND_EXPECTED_BUILDER_V2 }}
      READINESS_EXPECT_PRESENTATIONS: ${{ vars.OPENROUND_EXPECTED_PRESENTATIONS }}
      READINESS_EXPECT_PRESENTATION_REALTIME: ${{ vars.OPENROUND_EXPECTED_PRESENTATION_REALTIME }}
      READINESS_EXPECT_GROUPS: ${{ vars.OPENROUND_EXPECTED_GROUPS }}
      READINESS_EXPECT_DISCOVER: ${{ vars.OPENROUND_EXPECTED_DISCOVER }}
      READINESS_EXPECTED_BUILD_ID: ${{ github.sha }}
      READINESS_EXPECTED_IMAGE_REPOSITORY: ${{ needs.main-candidate.outputs.image_repository }}
      READINESS_EXPECTED_HOME_REGION: ${{ vars.OPENROUND_EXPECTED_HOME_REGION }}
      # Caddy intentionally does not route /metrics; the private collector uses the Compose network.
      READINESS_EXPECT_METRICS: disabled
      READINESS_OUTPUT: artifacts/readiness/remote-probe.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate required staging configuration
        env:
          READINESS_CREATOR_COOKIE: ${{ secrets.OPENROUND_CREATOR_COOKIE }}
          READINESS_SMTP_PROBE_EMAIL: ${{ secrets.OPENROUND_SMTP_PROBE_EMAIL }}
          READINESS_SMTP_OBSERVER_URL: ${{ secrets.OPENROUND_SMTP_OBSERVER_URL }}
          READINESS_SMTP_OBSERVER_TOKEN: ${{ secrets.OPENROUND_SMTP_OBSERVER_TOKEN }}
          READINESS_TELEMETRY_OBSERVER_URL: ${{ secrets.OPENROUND_TELEMETRY_OBSERVER_URL }}
          READINESS_TELEMETRY_OBSERVER_TOKEN: ${{ secrets.OPENROUND_TELEMETRY_OBSERVER_TOKEN }}
          READINESS_DEPLOYMENT_RECEIPT_JSON: ${{ secrets.OPENROUND_DEPLOYMENT_RECEIPT_JSON }}
        run: |
          test -n "$READINESS_API_URL"
          test -n "$READINESS_WEB_URL"
          test -n "$READINESS_MEDIA_URL"
          test -n "$READINESS_EXPECTED_WEB_ORIGIN"
          test -n "$READINESS_EXPECT_BILLING"
          test -n "$READINESS_EXPECT_COMMUNITY_MODE"
          test -n "$READINESS_EXPECT_SIGNUPS"
          test -n "$READINESS_EXPECT_SESSION_CREATION"
          test -n "$READINESS_EXPECT_MEDIA_UPLOADS"
          test -n "$READINESS_EXPECT_UX_BETA"
          test -n "$READINESS_EXPECT_RECOVERY_REHEARSAL"
          test -n "$READINESS_EXPECT_PRACTICE_ASSIGNMENTS"
          test -n "$READINESS_EXPECT_WORKSPACE_SHELL"
          test -n "$READINESS_EXPECT_BUILDER_V2"
          test -n "$READINESS_EXPECT_PRESENTATIONS"
          test -n "$READINESS_EXPECT_PRESENTATION_REALTIME"
          test -n "$READINESS_EXPECT_GROUPS"
          test -n "$READINESS_EXPECT_DISCOVER"
          test -n "$READINESS_EXPECTED_BUILD_ID"
          test -n "$READINESS_EXPECTED_IMAGE_REPOSITORY"
          test -n "$READINESS_EXPECTED_HOME_REGION"
          test -n "$READINESS_EXPECT_METRICS"
          test -n "$READINESS_CREATOR_COOKIE"
          test -n "$READINESS_SMTP_PROBE_EMAIL"
          test -n "$READINESS_SMTP_OBSERVER_URL"
          test -n "$READINESS_SMTP_OBSERVER_TOKEN"
          test -n "$READINESS_TELEMETRY_OBSERVER_URL"
          test -n "$READINESS_TELEMETRY_OBSERVER_TOKEN"
          test -n "$READINESS_DEPLOYMENT_RECEIPT_JSON"
      - name: Probe deployment, media, delivery, and telemetry readiness
        env:
          READINESS_CREATOR_COOKIE: ${{ secrets.OPENROUND_CREATOR_COOKIE }}
          READINESS_SMTP_PROBE_EMAIL: ${{ secrets.OPENROUND_SMTP_PROBE_EMAIL }}
          READINESS_SMTP_OBSERVER_URL: ${{ secrets.OPENROUND_SMTP_OBSERVER_URL }}
          READINESS_SMTP_OBSERVER_TOKEN: ${{ secrets.OPENROUND_SMTP_OBSERVER_TOKEN }}
          READINESS_TELEMETRY_OBSERVER_URL: ${{ secrets.OPENROUND_TELEMETRY_OBSERVER_URL }}
          READINESS_TELEMETRY_OBSERVER_TOKEN: ${{ secrets.OPENROUND_TELEMETRY_OBSERVER_TOKEN }}
          READINESS_DEPLOYMENT_RECEIPT_JSON: ${{ secrets.OPENROUND_DEPLOYMENT_RECEIPT_JSON }}
        run: pnpm smoke:remote
      - name: Upload redacted remote-readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: single-vm-staging-remote-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/readiness/remote-probe.json
          if-no-files-found: warn
          retention-days: 30

  target-region-load:
    if: github.ref == 'refs/heads/main'
    needs: [main-candidate, remote-readiness]
    runs-on: [self-hosted, single-vm-staging, actions-runner-2-327-1-plus]
    timeout-minutes: 90
    environment: single-vm-staging
    env:
      LOAD_BASE_URL: ${{ needs.main-candidate.outputs.public_api_url }}
      LOAD_ORIGIN: ${{ needs.main-candidate.outputs.public_web_url }}
      LOAD_RUNNER_REGION: ${{ vars.OPENROUND_LOAD_RUNNER_REGION }}
      LOAD_EXPECTED_BUILD_ID: ${{ github.sha }}
      LOAD_SATURATION_EVIDENCE_REFERENCE: ${{ vars.OPENROUND_TARGET_SATURATION_EVIDENCE_REFERENCE }}
      LOAD_DURABLE_ARCHIVE_REFERENCE: ${{ vars.OPENROUND_TARGET_DURABLE_ARCHIVE_REFERENCE }}
      LOAD_RUN_ID: staging-${{ github.run_id }}-${{ github.run_attempt }}
      JOIN_BATCH_SIZE: "20"
      ASSERT_PERFORMANCE: "true"
      RESTART_SERVER: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate target-region load configuration
        env:
          LOAD_CREATOR_COOKIE: ${{ secrets.OPENROUND_CREATOR_COOKIE }}
        run: |
          test -n "$LOAD_BASE_URL"
          test -n "$LOAD_ORIGIN"
          test -n "$LOAD_RUNNER_REGION"
          test -n "$LOAD_CREATOR_COOKIE"
          test -n "$LOAD_EXPECTED_BUILD_ID"
          test -n "$LOAD_SATURATION_EVIDENCE_REFERENCE"
          test -n "$LOAD_DURABLE_ARCHIVE_REFERENCE"
          node scripts/ops/target-load-evidence.mjs validate-references \
            --saturation-reference "$LOAD_SATURATION_EVIDENCE_REFERENCE" \
            --durable-archive-reference "$LOAD_DURABLE_ARCHIVE_REFERENCE"
      - name: Capture load-generator provenance
        run: |
          mkdir -p artifacts/readiness
          node -e '
            const { createHash } = require("node:crypto");
            const fs = require("node:fs");
            fs.writeFileSync(
              "artifacts/readiness/load-runner-provenance.json",
              `${JSON.stringify({
                schemaVersion: 3,
                artifactType: "target-load-runner-provenance",
                candidateBuildId: process.env.LOAD_EXPECTED_BUILD_ID,
                workflowCommit: process.env.GITHUB_SHA,
                declaredRegion: process.env.LOAD_RUNNER_REGION,
                capturedAt: new Date().toISOString(),
                workflowRunId: process.env.GITHUB_RUN_ID,
                workflowRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                runner: {
                  nameSha256: `sha256:${createHash("sha256").update(process.env.RUNNER_NAME).digest("hex")}`,
                  os: process.env.RUNNER_OS,
                  architecture: process.env.RUNNER_ARCH,
                  minimumRequiredVersion: "2.327.1",
                  versionAttestationLabel: "actions-runner-2-327-1-plus",
                  requiredLabels: [
                    "self-hosted",
                    "single-vm-staging",
                    "actions-runner-2-327-1-plus",
                  ],
                },
              }, null, 2)}\n`,
              { mode: 0o600 },
            );
          '
      - name: Run 50-client target-region Round gate
        env:
          LOAD_CREATOR_COOKIE: ${{ secrets.OPENROUND_CREATOR_COOKIE }}
          CLIENTS: "50"
          LOAD_RUN_ID: staging-${{ github.run_id }}-${{ github.run_attempt }}-round-50
          LOAD_OUTPUT: artifacts/readiness/target-region-round-50.json
        run: pnpm load:compose
      - name: Run 50-client target-region Presentation gate
        env:
          LOAD_CREATOR_COOKIE: ${{ secrets.OPENROUND_CREATOR_COOKIE }}
          CLIENTS: "50"
          LOAD_RUN_ID: staging-${{ github.run_id }}-${{ github.run_attempt }}-presentation-50
          LOAD_OUTPUT: artifacts/readiness/target-region-presentation-50.json
        run: pnpm load:presentation:compose
      - name: Run 250-client target-region Round gate
        env:
          LOAD_CREATOR_COOKIE: ${{ secrets.OPENROUND_CREATOR_COOKIE }}
          CLIENTS: "250"
          JOIN_BATCH_SIZE: "25"
          LOAD_RUN_ID: staging-${{ github.run_id }}-${{ github.run_attempt }}-round-250
          LOAD_OUTPUT: artifacts/readiness/target-region-round-250.json
        run: pnpm load:compose
      - name: Run 250-client target-region Presentation gate
        env:
          LOAD_CREATOR_COOKIE: ${{ secrets.OPENROUND_CREATOR_COOKIE }}
          CLIENTS: "250"
          JOIN_BATCH_SIZE: "25"
          LOAD_RUN_ID: staging-${{ github.run_id }}-${{ github.run_attempt }}-presentation-250
          LOAD_OUTPUT: artifacts/readiness/target-region-presentation-250.json
        run: pnpm load:presentation:compose
      - name: Run repeated target-region soak
        if: needs.main-candidate.outputs.soak_minutes != '0'
        env:
          LOAD_CREATOR_COOKIE: ${{ secrets.OPENROUND_CREATOR_COOKIE }}
          CLIENTS: "50"
          SOAK_MINUTES: ${{ needs.main-candidate.outputs.soak_minutes }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness/soak
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          deadline=$((SECONDS + SOAK_MINUTES * 60))
          iteration=0
          while (( SECONDS < deadline )); do
            iteration=$((iteration + 1))
            LOAD_RUN_ID="staging-${{ github.run_id }}-${{ github.run_attempt }}-soak-${iteration}" \
              LOAD_OUTPUT="artifacts/readiness/soak/run-${iteration}.json" \
              pnpm load:compose
            if (( SECONDS < deadline )); then sleep 5; fi
          done
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          test "$iteration" -gt 0
          node scripts/ops/target-load-evidence.mjs summarize-soak \
            --directory artifacts/readiness/soak \
            --expected-build "$LOAD_EXPECTED_BUILD_ID" \
            --runner-region "$LOAD_RUNNER_REGION" \
            --requested-minutes "$SOAK_MINUTES" \
            --started-at "$started_at" \
            --finished-at "$finished_at" \
            --output artifacts/readiness/soak-summary.json
      - name: Record explicitly skipped soak
        if: needs.main-candidate.outputs.soak_minutes == '0'
        run: |
          set -euo pipefail
          mkdir -p artifacts/readiness/soak
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/ops/target-load-evidence.mjs summarize-soak \
            --directory artifacts/readiness/soak \
            --expected-build "$LOAD_EXPECTED_BUILD_ID" \
            --runner-region "$LOAD_RUNNER_REGION" \
            --requested-minutes 0 \
            --started-at "$observed_at" \
            --finished-at "$observed_at" \
            --output artifacts/readiness/soak-summary.json
      - name: Validate and bind target-region evidence bundle
        run: |
          set -euo pipefail
          node scripts/ops/target-load-evidence.mjs bundle \
            --provenance artifacts/readiness/load-runner-provenance.json \
            --round-50 artifacts/readiness/target-region-round-50.json \
            --presentation-50 artifacts/readiness/target-region-presentation-50.json \
            --round-250 artifacts/readiness/target-region-round-250.json \
            --presentation-250 artifacts/readiness/target-region-presentation-250.json \
            --soak-summary artifacts/readiness/soak-summary.json \
            --soak-directory artifacts/readiness/soak \
            --expected-build "$LOAD_EXPECTED_BUILD_ID" \
            --runner-region "$LOAD_RUNNER_REGION" \
            --saturation-reference "$LOAD_SATURATION_EVIDENCE_REFERENCE" \
            --durable-archive-reference "$LOAD_DURABLE_ARCHIVE_REFERENCE" \
            --output artifacts/readiness/target-region-evidence-bundle.json
      - name: Upload target-region load and soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: single-vm-staging-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/readiness/load-runner-provenance.json
            artifacts/readiness/target-region-round-50.json
            artifacts/readiness/target-region-presentation-50.json
            artifacts/readiness/target-region-round-250.json
            artifacts/readiness/target-region-presentation-250.json
            artifacts/readiness/soak/
            artifacts/readiness/soak-summary.json
            artifacts/readiness/target-region-evidence-bundle.json
          if-no-files-found: warn
          retention-days: 90

  stripe-replay:
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.main-candidate.outputs.run_stripe_replay == 'true'
    needs: [main-candidate, remote-readiness]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: single-vm-staging
    env:
      STRIPE_REHEARSAL_BASE_URL: ${{ needs.main-candidate.outputs.public_api_url }}
      STRIPE_REHEARSAL_ORIGIN: ${{ needs.main-candidate.outputs.public_web_url }}
      STRIPE_REHEARSAL_CREATOR_COOKIE: ${{ secrets.OPENROUND_STRIPE_REHEARSAL_COOKIE }}
      STRIPE_REHEARSAL_WEBHOOK_SECRET: ${{ secrets.OPENROUND_STRIPE_WEBHOOK_SECRET }}
      STRIPE_REHEARSAL_EXPECTED_BUILD_ID: ${{ github.sha }}
      STRIPE_REHEARSAL_OUTPUT: artifacts/readiness/stripe-replay.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rehearse signed Stripe webhook ordering
        run: |
          test -n "$STRIPE_REHEARSAL_BASE_URL"
          test -n "$STRIPE_REHEARSAL_ORIGIN"
          test -n "$STRIPE_REHEARSAL_CREATOR_COOKIE"
          test -n "$STRIPE_REHEARSAL_WEBHOOK_SECRET"
          test -n "$STRIPE_REHEARSAL_EXPECTED_BUILD_ID"
          pnpm smoke:stripe-replay
      - name: Upload signed-webhook rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: single-vm-staging-stripe-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/readiness/stripe-replay.json
          if-no-files-found: warn
          retention-days: 90
