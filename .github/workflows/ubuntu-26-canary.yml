name: Ubuntu 26 compatibility canary

on:
  pull_request:
    paths:
      - .github/workflows/*.yml
      - .dockerignore
      - apps/server/Dockerfile
      - apps/web/Dockerfile
      - apps/control/Dockerfile
      - scripts/check-image-runtime.mjs
      - compose.yaml
      - compose.*.yaml
      - pnpm-lock.yaml
  workflow_dispatch:
  schedule:
    - cron: "43 10 * * 2"

permissions:
  contents: read

concurrency:
  group: ubuntu-26-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu26-production-compose:
    name: Ubuntu 26 / production Compose
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify MinIO volume ownership across upgrade and rollback
        run: pnpm smoke:minio-volume-upgrade
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start production media profile
        run: docker compose -f compose.yaml -f compose.media.yaml up -d --build --wait
      - name: Verify one-shot image migration
        run: >-
          docker compose -f compose.yaml -f compose.media.yaml
          run --rm --no-deps server node dist/migrate.js
      - name: API and dependency smoke
        run: pnpm smoke:compose
      - name: Browser media smoke
        run: pnpm test:e2e:compose
      - name: Provision dashboard and evaluate alert rules
        run: |
          docker compose -f compose.yaml -f compose.media.yaml -f compose.observability.yaml --profile observability up -d prometheus grafana
          pnpm smoke:observability
      - name: Two-process mutation and process-loss smoke
        run: |
          docker compose -f compose.yaml -f compose.test.yaml -f compose.multiwriter.yaml up -d --no-build --wait server server-secondary mailpit
          pnpm smoke:multi-process
      - name: Isolated backup and restore drill
        run: pnpm smoke:restore
      - name: 100-client correctness, latency, and restart recovery
        run: pnpm load:compose
        env:
          ASSERT_PERFORMANCE: "false"
          CLIENTS: "100"
          JOIN_BATCH_SIZE: "20"
          LOAD_OUTPUT: artifacts/readiness/ubuntu-26-production-smoke-load.json
          RESTART_SERVER: "true"
      - name: Capture Compose logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.media.yaml -f compose.test.yaml -f compose.multiwriter.yaml -f compose.observability.yaml --profile observability logs --no-color > ubuntu-26-compose-failure.log
      - name: Capture server metrics
        if: always()
        continue-on-error: true
        run: docker compose -f compose.yaml -f compose.media.yaml -f compose.test.yaml -f compose.multiwriter.yaml -f compose.observability.yaml --profile observability exec -T server wget -qO- http://127.0.0.1:4000/metrics > ubuntu-26-production-smoke-metrics.prom
      - name: Upload Ubuntu 26 Compose evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-26-production-smoke-${{ github.run_id }}
          path: |
            artifacts/readiness/ubuntu-26-production-smoke-load.json
            ubuntu-26-compose-failure.log
            ubuntu-26-production-smoke-metrics.prom
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop disposable stack
        if: always()
        run: docker compose -f compose.yaml -f compose.media.yaml -f compose.test.yaml -f compose.multiwriter.yaml -f compose.observability.yaml --profile observability down --volumes

  ubuntu26-image-toolchain:
    name: Ubuntu 26 / image toolchain
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Record host and image-toolchain versions
        run: |
          mkdir -p artifacts/readiness
          {
            uname -a
            docker version
            docker compose version
            docker buildx version
            cosign version
            trivy --version
          } > artifacts/readiness/ubuntu-26-image-toolchain.txt 2>&1
      - name: Build server and web images
        run: |
          docker buildx build \
            --load \
            --file apps/server/Dockerfile \
            --build-arg OPENROUND_BUILD_ID="$GITHUB_SHA" \
            --tag openround-server:ubuntu-26-canary \
            .
          docker buildx build \
            --load \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.ca \
            --build-arg OPENROUND_BUILD_ID="$GITHUB_SHA" \
            --tag openround-web:ubuntu-26-canary \
            .
      - name: Build control image
        run: |
          docker buildx build \
            --load \
            --file apps/control/Dockerfile \
            --build-arg OPENROUND_BUILD_ID="$GITHUB_SHA" \
            --tag openround-control:ubuntu-26-canary \
            .
      - name: Verify runtime image invariants
        run: |
          set -euo pipefail
          for component in server web control; do
            docker run --rm --interactive --network none --entrypoint node \
              "openround-${component}:ubuntu-26-canary" \
              --input-type=module - "$component" < scripts/check-image-runtime.mjs
          done | tee artifacts/readiness/ubuntu-26-runtime-invariants.txt
      - name: Scan canary images
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --output artifacts/readiness/ubuntu-26-server-trivy.txt \
            openround-server:ubuntu-26-canary
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --output artifacts/readiness/ubuntu-26-web-trivy.txt \
            openround-web:ubuntu-26-canary
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --output artifacts/readiness/ubuntu-26-control-trivy.txt \
            openround-control:ubuntu-26-canary
      - name: Sign and verify a local canary payload
        env:
          COSIGN_PASSWORD: ubuntu-26-canary-only
        run: |
          set -euo pipefail
          key_prefix="$RUNNER_TEMP/ubuntu-26-cosign"
          payload=artifacts/readiness/ubuntu-26-cosign-payload.txt
          signature=artifacts/readiness/ubuntu-26-cosign-signature.txt
          printf '%s\n' "$GITHUB_SHA" > "$payload"
          cosign generate-key-pair --output-key-prefix "$key_prefix"
          cosign sign-blob \
            --yes \
            --use-signing-config=false \
            --new-bundle-format=false \
            --tlog-upload=false \
            --key "${key_prefix}.key" \
            --output-signature "$signature" \
            "$payload"
          cosign verify-blob \
            --insecure-ignore-tlog \
            --key "${key_prefix}.pub" \
            --signature "$signature" \
            "$payload" \
            > artifacts/readiness/ubuntu-26-cosign-verification.txt
          rm -f "${key_prefix}.key" "${key_prefix}.pub"
      - name: Upload Ubuntu 26 image-toolchain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-26-image-toolchain-${{ github.run_id }}
          path: |
            artifacts/readiness/ubuntu-26-image-toolchain.txt
            artifacts/readiness/ubuntu-26-runtime-invariants.txt
            artifacts/readiness/ubuntu-26-server-trivy.txt
            artifacts/readiness/ubuntu-26-web-trivy.txt
            artifacts/readiness/ubuntu-26-control-trivy.txt
            artifacts/readiness/ubuntu-26-cosign-payload.txt
            artifacts/readiness/ubuntu-26-cosign-signature.txt
            artifacts/readiness/ubuntu-26-cosign-verification.txt
          if-no-files-found: error
          retention-days: 14
