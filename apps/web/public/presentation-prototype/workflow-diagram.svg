<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">A clear path from request to handoff</title>
  <desc id="description">Three connected cards show a request, a clarified next step, and an agreed handoff. This is an original illustrative diagram, not measured product data.</desc>
  <rect width="960" height="640" rx="36" fill="#edf4f2"/>
  <path d="M250 320H710" fill="none" stroke="#497d73" stroke-width="8" stroke-linecap="round"/>
  <path d="m428 305 20 15-20 15m166-30 20 15-20 15" fill="none" stroke="#497d73" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#497d73" stroke-width="4">
    <rect x="80" y="220" width="220" height="200" rx="22"/>
    <rect x="370" y="220" width="220" height="200" rx="22"/>
    <rect x="660" y="220" width="220" height="200" rx="22"/>
  </g>
  <g fill="none" stroke="#23574d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 270h80v64h-48l-20 18v-18h-12z"/>
    <path d="M440 279h80m-80 26h60m-60 26h40"/>
    <path d="m726 310 23 23 45-51"/>
  </g>
  <g fill="#23574d" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <text x="190" y="385">Request</text>
    <text x="480" y="385">Clarify</text>
    <text x="770" y="385">Handoff</text>
  </g>
  <circle cx="190" cy="160" r="14" fill="#d5a54e"/>
  <circle cx="480" cy="160" r="14" fill="#497d73"/>
  <circle cx="770" cy="160" r="14" fill="#23574d"/>
</svg>
