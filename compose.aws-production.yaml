# Append after the single-VM and observability profiles. Requires Compose >=2.24.4.
services:
  minio-volume-owner:
    profiles: !override [unused-local-storage]
  minio:
    profiles: !override [unused-local-storage]
  minio-init:
    profiles: !override [unused-local-storage]

  server:
    depends_on: !override
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?Set the regional AWS S3 HTTPS endpoint}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set the same regional AWS S3 HTTPS endpoint}
      S3_REGION: ${S3_REGION:?Set the AWS region}
      S3_BUCKET: ${S3_BUCKET:?Set the provisioned private media bucket}
      S3_FORCE_PATH_STYLE: "false"
      # Empty app credentials select the SDK's EC2 instance-profile credential provider.
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""

  caddy:
    depends_on: !override
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes: !override
      - ./infra/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
