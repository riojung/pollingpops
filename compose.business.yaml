# Opt-in development/business overlay; customer hosting does not depend on the console.
services:
  server:
    environment:
      CONTROL_PUBLIC_ORIGIN: ${CONTROL_PUBLIC_ORIGIN:-}
      COMMUNITY_MODE: ${COMMUNITY_MODE:-true}
      BACKGROUND_JOBS_MODE: separate
      BUSINESS_PLATFORM_ENABLED: ${BUSINESS_PLATFORM_ENABLED:-false}
      BUSINESS_EVENT_CREDITS_ENABLED: ${BUSINESS_EVENT_CREDITS_ENABLED:-false}
      BUSINESS_CATALOG_JSON: ${BUSINESS_CATALOG_JSON:-[]}
      BUSINESS_STRIPE_AUTOMATIC_TAX_ENABLED: ${BUSINESS_STRIPE_AUTOMATIC_TAX_ENABLED:-false}
      BUSINESS_BILLING_WORKER_INTERVAL_MS: ${BUSINESS_BILLING_WORKER_INTERVAL_MS:-3000}
      BUSINESS_BILLING_WORKER_LEASE_MS: ${BUSINESS_BILLING_WORKER_LEASE_MS:-120000}
      BUSINESS_BILLING_RECONCILE_INTERVAL_MS: ${BUSINESS_BILLING_RECONCILE_INTERVAL_MS:-900000}
      QUICKBOOKS_ENVIRONMENT: ${QUICKBOOKS_ENVIRONMENT:-sandbox}
      QUICKBOOKS_PRODUCTION_READS_ENABLED: ${QUICKBOOKS_PRODUCTION_READS_ENABLED:-false}
      BILLING_MODE: ${BILLING_MODE:-disabled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
  jobs:
    extends:
      file: compose.yaml
      service: server
    command: [node, dist/jobs.js]
    healthcheck:
      disable: true
    environment:
      COMMUNITY_MODE: ${COMMUNITY_MODE:-true}
      BACKGROUND_JOBS_MODE: separate
      BUSINESS_PLATFORM_ENABLED: ${BUSINESS_PLATFORM_ENABLED:-false}
      BUSINESS_EVENT_CREDITS_ENABLED: ${BUSINESS_EVENT_CREDITS_ENABLED:-false}
      BUSINESS_CATALOG_JSON: ${BUSINESS_CATALOG_JSON:-[]}
      BUSINESS_STRIPE_AUTOMATIC_TAX_ENABLED: ${BUSINESS_STRIPE_AUTOMATIC_TAX_ENABLED:-false}
      BUSINESS_BILLING_WORKER_INTERVAL_MS: ${BUSINESS_BILLING_WORKER_INTERVAL_MS:-3000}
      BUSINESS_BILLING_WORKER_LEASE_MS: ${BUSINESS_BILLING_WORKER_LEASE_MS:-120000}
      BUSINESS_BILLING_RECONCILE_INTERVAL_MS: ${BUSINESS_BILLING_RECONCILE_INTERVAL_MS:-900000}
      BILLING_MODE: ${BILLING_MODE:-disabled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-}
      QUICKBOOKS_ENVIRONMENT: ${QUICKBOOKS_ENVIRONMENT:-sandbox}
      QUICKBOOKS_PRODUCTION_READS_ENABLED: ${QUICKBOOKS_PRODUCTION_READS_ENABLED:-false}
  control:
    image: polling-pops-control:development
    build:
      context: .
      dockerfile: apps/control/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CONTROL_ENABLED: ${CONTROL_ENABLED:-false}
      CONTROL_PUBLIC_ORIGIN: ${CONTROL_PUBLIC_ORIGIN:-}
      # Production control accepts only an explicitly trusted HTTPS product origin.
      # Leave unset for an HTTP local product; direct operator sign-in still works.
      CONTROL_PRODUCT_ORIGIN: ${CONTROL_PRODUCT_ORIGIN:-}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-}
      OPERATOR_OIDC_ISSUER: ${OPERATOR_OIDC_ISSUER:-}
      OPERATOR_OIDC_CLIENT_ID: ${OPERATOR_OIDC_CLIENT_ID:-}
      OPERATOR_OIDC_CLIENT_SECRET: ${OPERATOR_OIDC_CLIENT_SECRET:-}
      OPERATOR_OIDC_MFA_POLICY_ENFORCED: ${OPERATOR_OIDC_MFA_POLICY_ENFORCED:-false}
      OPERATOR_OIDC_REQUIRED_AMR: ${OPERATOR_OIDC_REQUIRED_AMR:-}
      OPERATOR_OIDC_ALLOWED_ACR: ${OPERATOR_OIDC_ALLOWED_ACR:-}
      OPERATOR_BOOTSTRAP_IDENTITIES: ${OPERATOR_BOOTSTRAP_IDENTITIES:-[]}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-}
    ports:
      - 127.0.0.1:3002:3002
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/api/health/ready', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 5
    restart: unless-stopped
