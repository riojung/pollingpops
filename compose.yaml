# Keep this data namespace stable across the Polling Pops rebrand.
name: openround

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openround
      POSTGRES_PASSWORD: openround-local
      POSTGRES_USER: openround
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openround -d openround"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/001-runtime-role.sql:/docker-entrypoint-initdb.d/001-runtime-role.sql:ro

  valkey:
    image: valkey/valkey:8-alpine
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--auto-aof-rewrite-percentage",
        "${VALKEY_AUTO_AOF_REWRITE_PERCENTAGE:-100}",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - valkey-data:/data

  minio-volume-owner:
    image: cgr.dev/chainguard/wolfi-base@sha256:fac38d12efdb4bf43ac9e599a31db10a27ad5dd71e5f1618790962eda8d66180
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        find /data -xdev ! -user 65532 -exec chown -h 65532:65532 {} +
        test -z "$$(find /data -xdev ! -user 65532 -print -quit)"
    read_only: true
    restart: "no"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - minio-data:/data

  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    depends_on:
      minio-volume-owner:
        condition: service_completed_successfully
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: openround
      MINIO_ROOT_PASSWORD: change-this-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: ${OPENROUND_PUBLIC_URL:-http://localhost:8080}
      MINIO_API_CORS_ALLOW_CREDENTIALS_WITH_WILDCARD: "off"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    ports:
      - "${OPENROUND_STORAGE_BIND:-127.0.0.1}:9000:9000"
    volumes:
      - minio-data:/data

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 openround change-this-local-secret
        mc mb --ignore-existing local/openround-media
        mc anonymous set none local/openround-media
        cat > /tmp/pollingpops-media-lifecycle.json <<EOF
        {
          "Rules": [
            {
              "ID": "expire-abandoned-quarantine-uploads",
              "Status": "Enabled",
              "Filter": { "Prefix": "quarantine/" },
              "Expiration": { "Days": 1 }
            },
            {
              "ID": "expire-abandoned-finalization-candidates",
              "Status": "Enabled",
              "Filter": {
                "And": {
                  "Prefix": "media/",
                  "Tags": [
                    { "Key": "openround-finalization-state", "Value": "temporary" }
                  ]
                }
              },
              "Expiration": { "Days": 7 }
            }
          ]
        }
        EOF
        mc ilm rule import local/openround-media < /tmp/pollingpops-media-lifecycle.json
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_MAX_MESSAGES: 200
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  server:
    image: polling-pops-server:development
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        OPENROUND_BUILD_ID: ${OPENROUND_BUILD_ID:-unversioned}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      WEB_ORIGIN: ${OPENROUND_PUBLIC_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${OPENROUND_PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: "false"
      ALLOW_INSECURE_LOCAL_HTTP: "true"
      DATABASE_URL: postgresql://openround_app:openround-app-local@postgres:5432/openround
      DATABASE_MIGRATION_URL: postgresql://openround:openround-local@postgres:5432/openround
      REDIS_URL: redis://valkey:6379
      SESSION_MUTATION_LEASE_TTL_MS: ${SESSION_MUTATION_LEASE_TTL_MS:-15000}
      SESSION_MUTATION_LEASE_WAIT_MS: ${SESSION_MUTATION_LEASE_WAIT_MS:-5000}
      RUN_MIGRATIONS: "true"
      COMMUNITY_MODE: "true"
      MAX_SESSION_PARTICIPANTS: 100
      MAX_PRACTICE_PERSONAL_LINKS: 100
      RETENTION_INTERVAL_MINUTES: 60
      COMMUNITY_REPORT_RETENTION_DAYS: ${COMMUNITY_REPORT_RETENTION_DAYS:-365}
      AUTHORING_AI_MODE: ${AUTHORING_AI_MODE:-disabled}
      AUTHORING_AI_ENDPOINT: ${AUTHORING_AI_ENDPOINT:-}
      AUTHORING_AI_API_KEY: ${AUTHORING_AI_API_KEY:-}
      AUTHORING_AI_MODEL: ${AUTHORING_AI_MODEL:-operator-configured}
      AUTHORING_AI_PROVIDER_NAME: ${AUTHORING_AI_PROVIDER_NAME:-operator}
      AUTHORING_WORKER_INTERVAL_MS: ${AUTHORING_WORKER_INTERVAL_MS:-3000}
      AUTHORING_WORKER_LEASE_MS: ${AUTHORING_WORKER_LEASE_MS:-120000}
      AUTHORING_EXTRACTION_TIMEOUT_MS: ${AUTHORING_EXTRACTION_TIMEOUT_MS:-20000}
      OIDC_MODE: ${OIDC_MODE:-disabled}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLIENT_AUTH: ${OIDC_CLIENT_AUTH:-client_secret_post}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Institution sign-in}
      OIDC_TRANSACTION_TTL_SECONDS: ${OIDC_TRANSACTION_TTL_SECONDS:-300}
      LTI_MODE: ${LTI_MODE:-disabled}
      LTI_TOOL_PRIVATE_JWK: ${LTI_TOOL_PRIVATE_JWK:-}
      LTI_TOOL_KEY_ID: ${LTI_TOOL_KEY_ID:-openround-lti-1}
      LTI_TRANSACTION_TTL_SECONDS: ${LTI_TRANSACTION_TTL_SECONDS:-300}
      LTI_LAUNCH_TTL_SECONDS: ${LTI_LAUNCH_TTL_SECONDS:-900}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      MEDIA_QUARANTINE_RETENTION_HOURS: 24
      FEATURE_SIGNUPS: "true"
      FEATURE_SESSION_CREATION: "true"
      FEATURE_MEDIA_UPLOADS: "true"
      FEATURE_UX_BETA: "${FEATURE_UX_BETA:-false}"
      FEATURE_RECOVERY_REHEARSAL: "${FEATURE_RECOVERY_REHEARSAL:-false}"
      FEATURE_PRACTICE_ASSIGNMENTS: "${FEATURE_PRACTICE_ASSIGNMENTS:-false}"
      FEATURE_WORKSPACE_SHELL: "${FEATURE_WORKSPACE_SHELL:-false}"
      FEATURE_BUILDER_V2: "${FEATURE_BUILDER_V2:-false}"
      FEATURE_PRESENTATIONS: "${FEATURE_PRESENTATIONS:-false}"
      FEATURE_GROUPS: "${FEATURE_GROUPS:-false}"
      FEATURE_DISCOVER: "${FEATURE_DISCOVER:-false}"
      FEATURE_PRESENTATION_REALTIME: "${FEATURE_PRESENTATION_REALTIME:-false}"
      FEATURE_PRESENTATION_COMPANION: "${FEATURE_PRESENTATION_COMPANION:-false}"
      FEATURE_LIVE_FLEX_MODE: "${FEATURE_LIVE_FLEX_MODE:-false}"
      PRESENTATION_CONCURRENT_RESPONSE_WRITES: "${PRESENTATION_CONCURRENT_RESPONSE_WRITES:-false}"
      FEATURE_RECOVERY_PACKS: "${FEATURE_RECOVERY_PACKS:-false}"
      FEATURE_RECOVERY_PACK_LIVE_CARDS: "${FEATURE_RECOVERY_PACK_LIVE_CARDS:-false}"
      FEATURE_QUESTION_HEALTH: "${FEATURE_QUESTION_HEALTH:-false}"
      FEATURE_DECISION_REPLAY: "${FEATURE_DECISION_REPLAY:-false}"
      FEATURE_RECOVERY_TRAILS: "${FEATURE_RECOVERY_TRAILS:-false}"
      FEATURE_CONCEPT_HEALTH: "${FEATURE_CONCEPT_HEALTH:-false}"
      FEATURE_EXTENDED_QUESTION_TYPES: "${FEATURE_EXTENDED_QUESTION_TYPES:-false}"
      FEATURE_VERIFIED_INSTITUTION: "${FEATURE_VERIFIED_INSTITUTION:-false}"
      FEATURE_AUDIENCE_SCOPES: "${FEATURE_AUDIENCE_SCOPES:-false}"
      FEATURE_ROUND_CLIENT_PROTOCOL: "${FEATURE_ROUND_CLIENT_PROTOCOL:-false}"
      FEATURE_FEEDBACK_ROOMS: "${FEATURE_FEEDBACK_ROOMS:-false}"
      FEATURE_SURVEYS: "${FEATURE_SURVEYS:-false}"
      FEATURE_FEEDBACK_EXPORTS: "${FEATURE_FEEDBACK_EXPORTS:-false}"
      CORE_PARITY_WORKSPACE_ALLOWLIST: "${CORE_PARITY_WORKSPACE_ALLOWLIST:-}"
      UX_BETA_WORKSPACE_ALLOWLIST: "${UX_BETA_WORKSPACE_ALLOWLIST:-}"
      EVIDENCE_FEATURES_WORKSPACE_ALLOWLIST: "${EVIDENCE_FEATURES_WORKSPACE_ALLOWLIST:-}"
      METRICS_ENABLED: "true"
      TRACING_ENABLED: "false"
      ALLOW_IN_MEMORY: "false"
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Polling Pops <noreply@openround.local>
      DEVELOPMENT_EMAIL_INBOX_URL: ${DEVELOPMENT_EMAIL_INBOX_URL:-http://localhost:8025}
      AUTH_DEBUG_MAGIC_LINKS: "${AUTH_DEBUG_MAGIC_LINKS:-false}"
      POLICY_VERSION: community-operator-v1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${OPENROUND_STORAGE_URL:-http://localhost:9000}
      S3_REGION: ca-central-1
      S3_BUCKET: openround-media
      S3_ACCESS_KEY_ID: openround
      S3_SECRET_ACCESS_KEY: change-this-local-secret
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_SCAN_MODE: disabled
      BILLING_MODE: disabled
      ADMIN_TOKEN: replace-with-a-random-admin-token
      OPENROUND_MIGRATIONS_DIR: /app/migrations
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  web:
    image: polling-pops-web:development
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${OPENROUND_API_URL:-}"
        OPENROUND_BUILD_ID: ${OPENROUND_BUILD_ID:-unversioned}
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "${OPENROUND_API_URL:-}"
      OPENROUND_PUBLIC_URL: ${OPENROUND_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${OPENROUND_HTTP_BIND:-0.0.0.0}:8080:80"
    restart: unless-stopped
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  minio-data:
  postgres-data:
  valkey-data:
