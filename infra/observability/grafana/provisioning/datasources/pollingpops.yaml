apiVersion: 1

deleteDatasources:
  # Upgrades keep the stable UID, so remove its legacy display name before inserting.
  - name: OpenRound Prometheus
    orgId: 1
  - name: Polling Pops Prometheus
    orgId: 1

datasources:
  - name: Polling Pops Prometheus
    type: prometheus
    uid: openround-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
